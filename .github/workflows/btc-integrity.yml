name: BTC QA & Research

on:
  workflow_dispatch:
    inputs:
      full_research:
        description: 'Run expensive historical research/backtests'
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'BASELINE_FREEZE_v2.json'
      - 'MACRO_FREEZE_v1_2.json'
      - 'btc_validation/**'
      - 'shadow/SHADOW_FREEZE_v1_2.json'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'BASELINE_FREEZE_v2.json'
      - 'MACRO_FREEZE_v1_2.json'
      - 'btc_validation/**'
      - 'shadow/SHADOW_FREEZE_v1_2.json'
      - '.github/workflows/btc-integrity.yml'

permissions:
  contents: read

concurrency:
  group: btc-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compile all active Python
        run: python -m compileall -q .
      - name: Run complete unit/regression suite
        run: python -m unittest discover -v
      - name: Frozen runtime contract
        run: python -c 'from btc_validation.runtime import check_runtime_contract; check_runtime_contract(); print("RUNTIME_CONTRACT_PASS")'
      - name: QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-qa-${{ github.run_id }}
          retention-days: 30
          path: |
            BASELINE_FREEZE_v2.json
            MACRO_FREEZE_v1_2.json
            btc_validation/
            shadow/SHADOW_FREEZE_v1_2.json

  full-research:
    if: github.event_name == 'workflow_dispatch' && inputs.full_research
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Frozen baseline benchmark
        run: python run_baseline_fresh.py
      - name: Leading-signal walk-forward diagnostic
        run: python leading_signal_backtest.py
      - name: Derivatives diagnostic
        run: python derivatives_backtest.py
      - name: Corrected derivatives source audit
        run: python -m btc_validation.collect --out validation_inputs/corrected
      - name: Research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-full-research-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            artifacts/
            leading_signal_artifacts/
            derivatives_artifacts/
            validation_inputs/corrected/
