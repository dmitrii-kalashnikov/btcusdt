name: BTC Prospective Shadow

on:
  workflow_dispatch:
  schedule:
    - cron: '15 9 * * 2'

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: btc-prospective-shadow
  cancel-in-progress: false

jobs:
  shadow:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh main under shared writer lock
        run: |
          git fetch origin main
          git checkout -B shadow-main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Frozen runtime and shadow regression guard
        run: |
          python -m py_compile shadow_sources.py shadow_model.py shadow_score.py shadow_run.py
          python -m unittest -q test_shadow_run.py btc_validation.test_integrity
          python -c 'from btc_validation.runtime import check_runtime_contract; check_runtime_contract()'
      - name: Require frozen PIT seed
        run: |
          test -s shadow/seed_macro_weekly_features.csv
          sha256sum shadow/seed_macro_weekly_features.csv
      - name: Run frozen weekly shadow
        run: python shadow_run.py
      - name: Commit prospective state
        run: |
          set -euo pipefail
          git config user.name 'btc-shadow-bot'
          git config user.email 'btc-shadow-bot@users.noreply.github.com'
          git add shadow/forecasts.csv shadow/preclose_macro_snapshots.csv shadow/scorecard.csv shadow/promotion_status.json shadow/last_run.json
          git add shadow/issued_*.csv shadow/issued_*.json 2>/dev/null || true
          if [ -f shadow/issued_forecasts.jsonl ]; then git add shadow/issued_forecasts.jsonl; fi
          if ! git diff --cached --quiet; then
            git commit -m "shadow: weekly BTC prospective run $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Recheck publication evidence after immutable forecast commit
        run: |
          set -euo pipefail
          python - <<'PY'
          from btc_validation.issued import load_records, save_state
          state = save_state(load_records())
          assert state['evidence_failures'] == 0, state
          assert not any(x['status'] == 'AWAITING_PUBLICATION_PROOF' for x in state['row_status']), state
          print('POST_COMMIT_PUBLICATION_CHECK_PASS', state['issued_rows'], state['completed_rows'])
          PY
          git add shadow/issued_status.json shadow/issued_scorecard.csv shadow/issued_outcomes.csv
          if ! git diff --cached --quiet; then
            git commit -m "audit: refresh unchanged issued forecasts after publication"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Open review only on positive transition
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(python -c 'import json; print(json.load(open("shadow/promotion_status.json"))["status"])')"
          changed="$(python -c 'import json; print(str(json.load(open("shadow/promotion_status.json"))["changed"]).lower())')"
          if [ "$changed" = 'true' ] && { [ "$status" = 'WATCH_POSITIVE' ] || [ "$status" = 'PROMOTION_REVIEW' ]; }; then
            title="BTC macro shadow: ${status}"
            existing="$(gh issue list --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"
            if [ -z "$existing" ]; then
              gh issue create --title "$title" --body "Prospective shadow changed to ${status}. No auto-promotion. Check paired origins and issuance proof."
            fi
          fi
      - name: Open issue on runtime failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='BTC prospective shadow: DATA_RUNTIME_FAILURE'
          existing="$(gh issue list --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body "BTC shadow failed closed. No promotion. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          fi
      - name: Upload internal audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-prospective-shadow-${{ github.run_id }}
          path: shadow/
          retention-days: 90
          if-no-files-found: warn
