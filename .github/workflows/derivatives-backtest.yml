name: BTC Derivatives Backtest

on:
  push:
    paths:
      - 'derivatives_backtest.py'
      - '.github/workflows/derivatives-backtest.yml'
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile derivatives_backtest.py
      - name: Run derivatives benchmark
        run: python derivatives_backtest.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: derivatives-backtest-results
          path: derivatives_artifacts/
          if-no-files-found: warn
          retention-days: 90
